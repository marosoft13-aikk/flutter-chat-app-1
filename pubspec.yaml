name: chat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.0.5

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3

  # Google Sign In
  google_sign_in: ^5.4.3
  
  google_api_availability: 5.0.1
  # Utilities
  uuid: ^4.3.3
  path_provider: ^2.0.11
  intl: ^0.20.2

  # Image & media
  image_picker: ^1.0.7
  permission_handler: ^12.0.1

  # Audio recording / playback
  record: ^6.2.0
  audioplayers: ^6.6.0
  
  # Local notifications
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  http: ^1.6.0
  path_provider: ^2.1.2

flutter:
  uses-material-design: true

